    <ellipse cx="238.5" cy="340" rx="5.5" ry="9" fill="#F9E7A7"/>

    <!-- 4. Melted Wax Top Cap & Drips -->
    <path d="M208 206
             C208 197, 229 193, 256 193
             C283 193, 304 197, 304 206
             C304 214, 305 228, 306 242
             C307 254, 310 264, 304 267
             C299 269, 296 261, 296 248
             C296 232, 294 220, 286 220
             C281 220, 281 232, 283 245
             C285 256, 281 264, 274 263
             C267 262, 266 252, 267 236
             C268 224, 265 219, 254 220
             C241 221, 232 220, 225 220
             C221 220, 222 246, 223 264
             C224 277, 218 286, 211 284
             C204 282, 202 271, 205 258
